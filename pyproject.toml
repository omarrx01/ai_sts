[project]
name = "ai-sts"
version = "0.1.0"
description = "AI-powered electronics support assistant using Retrieval-Augmented Generation (RAG), OpenRouter embeddings, and Streamlit."
readme = "README.md"
authors = [
    { name = "omarrx01", email = "omarhaitham04@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.31.0",
    "numpy>=2.4.6",
    "ollama>=0.6.3",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
]

[project.scripts]
ai-sts = "ai_sts:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
